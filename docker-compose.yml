services:
  backend:
    build: 
      context: ./backend
    container_name: ed_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development

  frontend:
    build: 
      context: ./frontend
    container_name: ed_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita shadow volume das dependências locais
    environment:
      - CHOKIDAR_USEPOLLING=true # Garante que o hot-reload do Vite funcione através do container